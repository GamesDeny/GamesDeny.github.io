# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  maxInstances: 1
  # concurrency: 80
  cpu: 1
  memoryMiB: 512

scripts:
  buildCommand: npm run build
  runCommand: npm start

# Environment variables and secrets.
  # Configure environment variables.
  # See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
  # Grant access to secrets in Cloud Secret Manager.
  # You can create secrets with the CLI command `firebase apphosting:secrets:set <secretName>`.
  # See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
  env:
    - variable: NEXT_PUBLIC_NAME
      value: "Francesco Pio Montrano"
      availability:
        - BUILD
        - RUNTIME
    - variable: NEXT_PUBLIC_EMAIL
      value: "montrano.francesco@gmail.com"
      availability:
        - BUILD
        - RUNTIME
    - variable: NEXT_PUBLIC_GITHUB
      value: "https://github.com/GamesDeny"
      availability:
        - BUILD
        - RUNTIME
    - variable: NEXT_PUBLIC_LINKEDIN
      value: "https://www.linkedin.com/in/francesco-pio-montrano-740734204/"
      availability:
        - BUILD
        - RUNTIME
    - variable: NEXT_PUBLIC_INSTAGRAM
      value: "https://www.instagram.com/sleepy_fra/"
      availability:
        - BUILD
        - RUNTIME
    - variable: NEXT_PUBLIC_STACKOVERFLOW
      value: "https://stackoverflow.com/users/13755303/hypedbuddy"
